name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Create virtual CAN interface
        run: |
          # GitHub-hosted Ubuntu runners use an Azure kernel that does not
          # ship the vcan module. CAN tests skip automatically when vcan0
          # cannot be created (see tests/conftest.py).
          if sudo modprobe vcan 2>/dev/null; then
            sudo ip link add dev vcan0 type vcan || true
            sudo ip link set up vcan0
            echo "vcan0 is up"
          else
            echo "vcan module not available on this kernel; CAN tests will be skipped"
          fi

      - name: Run tests
        run: |
          uv run python -m pytest -m "not hardware" \
            --junitxml=reports/junit.xml \
            --cov=sutlib --cov=sut \
            --cov-report=xml:reports/coverage.xml

      - name: Set up Java
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate reports/allure-results -o reports/allure-report --clean

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/