[project]
name = "test-automation-pg"
version = "0.1.0"
description = "Modular pytest test framework for virtual embedded systems (CAN / Ethernet)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-ra",
    "--tb=short",
    "--alluredir=reports/allure-results",
    "--clean-alluredir",
]
markers = [
    "transport_can: requires a CAN/vcan link",
    "transport_eth: requires an Ethernet/TCP link",
    "hardware: requires real hardware (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
